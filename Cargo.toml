[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.dependencies]
# Pinned to 28: OpenZeppelin stellar-contracts 0.8.0 requires ^28, and 28/29
# can't share one lockfile (they pin incompatible soroban-wasmi pre-releases).
soroban-sdk = "28"
stellar-access = "=0.8.0"
stellar-macros = "=0.8.0"
stellar-tokens = "=0.8.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
